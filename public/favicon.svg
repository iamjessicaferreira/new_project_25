
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3785f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4a882;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b896;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e8d5b7;stop-opacity:0.7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#3b2f2f"/>

  <!-- Monitor body -->
  <rect x="4" y="5" width="24" height="17" rx="2" fill="#6b4f3a" stroke="#8b6f52" stroke-width="0.8"/>

  <!-- Screen -->
  <rect x="6" y="7" width="20" height="13" rx="1" fill="url(#glow)"/>

  <!-- Screen content lines (code lines) -->
  <rect x="8" y="9" width="8" height="1.2" rx="0.6" fill="#7a5c3e" opacity="0.6"/>
  <rect x="8" y="11.5" width="12" height="1.2" rx="0.6" fill="#7a5c3e" opacity="0.5"/>
  <rect x="8" y="14" width="6" height="1.2" rx="0.6" fill="#7a5c3e" opacity="0.4"/>
  <rect x="15" y="14" width="4" height="1.2" rx="0.6" fill="#a3785f" opacity="0.5"/>

  <!-- Cursor blink -->
  <rect x="8" y="16.5" width="1.5" height="1.5" rx="0.3" fill="#c4956a"/>

  <!-- Monitor stand -->
  <path d="M13 22 L19 22 L20 25 L12 25 Z" fill="#6b4f3a"/>

  <!-- Base -->
  <rect x="10" y="25" width="12" height="1.5" rx="0.75" fill="#8b6f52"/>
</svg>
